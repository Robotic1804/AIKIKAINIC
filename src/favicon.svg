<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Red background -->
  <rect width="32" height="32" rx="3" fill="#DC2626"/>

  <!-- White 合 (ai) character - drawn as paths -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top roof part (人 shape) -->
    <path d="M 16 7 L 11 12"/>
    <path d="M 16 7 L 21 12"/>

    <!-- Horizontal line -->
    <path d="M 10 14 L 22 14"/>

    <!-- Mouth/box -->
    <rect x="12" y="16" width="8" height="6" fill="none" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Bottom person shape (人) -->
    <path d="M 16 23 L 12 27" stroke-width="1.5"/>
    <path d="M 16 23 L 20 27" stroke-width="1.5"/>
  </g>
</svg>
