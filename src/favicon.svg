<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Red background -->
  <rect width="32" height="32" rx="3" fill="#DC2626"/>

  <!-- White 合 (ai) kanji - accurate representation -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top left diagonal (ノ) -->
    <path d="M 16 6 L 10 11.5" stroke-width="1.2"/>

    <!-- Top right diagonal (ノ) -->
    <path d="M 16 6 L 22 11.5" stroke-width="1.2"/>

    <!-- Horizontal line (一) -->
    <path d="M 9 13.5 L 23 13.5" stroke-width="1.3"/>

    <!-- 口 (mouth radical) - box in middle -->
    <!-- Top of box -->
    <path d="M 11.5 16 L 20.5 16" stroke-width="1.1"/>
    <!-- Left side -->
    <path d="M 11.5 16 L 11.5 21.5" stroke-width="1.1"/>
    <!-- Right side -->
    <path d="M 20.5 16 L 20.5 21.5" stroke-width="1.1"/>
    <!-- Bottom of box -->
    <path d="M 11.5 21.5 L 20.5 21.5" stroke-width="1.1"/>

    <!-- Bottom left diagonal -->
    <path d="M 16 22.5 L 10.5 28" stroke-width="1.4"/>

    <!-- Bottom right diagonal -->
    <path d="M 16 22.5 L 21.5 28" stroke-width="1.4"/>
  </g>
</svg>
