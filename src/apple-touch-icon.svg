<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Red background -->
  <rect width="180" height="180" fill="#DC2626"/>

  <!-- White 合 (ai) character - drawn as paths -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top roof part (人 shape) -->
    <path d="M 90 40 L 60 70"/>
    <path d="M 90 40 L 120 70"/>

    <!-- Horizontal line -->
    <path d="M 50 85 L 130 85" stroke-width="6"/>

    <!-- Mouth/box -->
    <rect x="65" y="95" width="50" height="35" fill="none" stroke="#ffffff" stroke-width="7"/>

    <!-- Bottom person shape (人) -->
    <path d="M 90 135 L 65 160" stroke-width="8"/>
    <path d="M 90 135 L 115 160" stroke-width="8"/>
  </g>
</svg>
