<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Red gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- White text -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#ffffff" text-anchor="middle">AIKIDO</text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="80" font-weight="normal" fill="#fecaca" text-anchor="middle">Nicaragua</text>
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="48" font-weight="300" fill="#fecaca" text-anchor="middle">合気道 • Armonía • Energía • Camino</text>

  <!-- Logo symbol -->
  <g transform="translate(600, 520)">
    <path d="M -40 60 L 0 -60 L 40 60 L 25 60 L 0 -25 L -25 60 Z" fill="#ffffff"/>
    <rect x="-30" y="20" width="60" height="15" rx="3" fill="#ffffff"/>
  </g>
</svg>
