<!-- email-verificado.component.html -->
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
    @if (cargando()) {
      <div class="flex flex-col items-center">
        <div class="animate-spin mx-auto h-12 w-12 border-4 border-red-600 rounded-full mb-4"></div>
        <p class="text-gray-700 font-semibold">{{ mensaje() }}</p>
      </div>
    } @else {
      <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
        {{ mensaje() }}
      </div>
      <p class="text-gray-600 mb-4">Serás redirigido automáticamente.</p>
    }
  </div>
</div>
