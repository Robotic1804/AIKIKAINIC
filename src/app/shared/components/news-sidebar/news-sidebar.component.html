<!-- News Sidebar Component -->
<aside class="news-sidebar bg-white rounded-xl shadow-lg p-6 sticky top-8">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
    <h3 class="text-xl font-bold text-gray-900">{{ title }}</h3>
    <a
      routerLink="/noticias"
      class="text-red-600 hover:text-red-700 text-sm font-semibold flex items-center gap-1 transition-colors"
    >
      Ver todas
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  <!-- Loading State -->
  @if (isLoading) {
    <div class="flex justify-center items-center py-8">
      <div class="animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-red-600"></div>
    </div>
  }

  <!-- News List -->
  @if (!isLoading && newsList.length > 0) {
    <div class="space-y-4">
      @for (news of newsList; track news._id; let isLast = $last) {
        <div [class.border-b]="!isLast" [class.border-gray-200]="!isLast" [class.pb-4]="!isLast">
          <app-news-card
            [news]="news"
            [compact]="true"
          />
        </div>
      }
    </div>
  }

  <!-- Empty State -->
  @if (!isLoading && newsList.length === 0) {
    <div class="text-center py-8">
      <svg class="w-16 h-16 mx-auto text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <p class="text-gray-500 text-sm">No hay noticias disponibles</p>
    </div>
  }

  <!-- Footer CTA -->
  @if (!isLoading && newsList.length > 0) {
    <div class="mt-6 pt-4 border-t border-gray-200">
      <a
        routerLink="/noticias"
        class="block w-full bg-red-600 hover:bg-red-700 text-white text-center px-4 py-3 rounded-lg font-semibold transition-colors"
      >
        Explorar Todas las Noticias
      </a>
    </div>
  }
</aside>
